<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.35" />
      <circle cx="40" cy="0" r="1" fill="#475569" fill-opacity="0.6" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .gradient-span {
        fill: url(#accentGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
      }
      /* Dynamic Ambient Animations */
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.15); opacity: 0.55; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes signalFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      .ambient-orb1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .ambient-orb2 {
        animation: pulseGlow 10s ease-in-out infinite reverse;
        transform-origin: 1000px 320px;
      }
      .floating-layer {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .stream-path {
        stroke-dasharray: 8 16;
        animation: signalFlow 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle class="ambient-orb1" cx="220" cy="110" r="180" fill="url(#glowGrad1)" filter="url(#glowEffect)" />
  <circle class="ambient-orb2" cx="1020" cy="300" r="220" fill="url(#glowGrad2)" filter="url(#glowEffect)" />

  <!-- Background Connection Lines (SSO Federation Mesh) -->
  <g opacity="0.35">
    <path class="stream-path" d="M 120 340 C 350 340, 450 180, 700 180 C 850 180, 950 260, 1120 260" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-path" d="M 80 120 C 300 120, 420 280, 680 280 C 880 280, 980 150, 1140 150" fill="none" stroke="#a855f7" stroke-width="1.8" />
  </g>

  <!-- Foreground Content Area -->
  <g class="floating-layer">
    <!-- Top Category Badge -->
    <g transform="translate(100, 52)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="pill-text" fill="#cbd5e1">ENTERPRISE IDENTITY &amp; SSO</text>
    </g>

    <!-- Main Title -->
    <text x="100" y="132" class="title-text" filter="url(#shadow)">
      Awesome <tspan class="gradient-span">Enterprise SSO</tspan>
    </text>

    <!-- Subtitle -->
    <text x="100" y="174" class="subtitle-text">
      The Curated Guide to SAML 2.0, OIDC, Okta, Azure AD &amp; Open-Source Identity Platforms
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(100, 225)">
      <!-- Pill 1: SAML 2.0 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
        <text x="65" y="26" text-anchor="middle" class="pill-text">⚡ SAML 2.0</text>
      </g>
      <!-- Pill 2: OIDC & OAuth -->
      <g transform="translate(145, 0)">
        <rect width="170" height="42" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
        <text x="85" y="26" text-anchor="middle" class="pill-text">🔑 OIDC &amp; OAuth 2.0</text>
      </g>
      <!-- Pill 3: Okta & Azure AD -->
      <g transform="translate(330, 0)">
        <rect width="210" height="42" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.95" />
        <text x="105" y="26" text-anchor="middle" class="pill-text">🛡️ Okta &amp; Entra ID</text>
      </g>
      <!-- Pill 4: Open Source IdPs -->
      <g transform="translate(555, 0)">
        <rect width="190" height="42" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.2" opacity="0.95" />
        <text x="95" y="26" text-anchor="middle" class="pill-text">🌐 Self-Hosted IdPs</text>
      </g>
      <!-- Pill 5: SCIM & Directory -->
      <g transform="translate(760, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" opacity="0.95" />
        <text x="90" y="26" text-anchor="middle" class="pill-text">📦 SCIM Federation</text>
      </g>
    </g>

    <!-- Bottom Stat & Architecture Bar -->
    <g transform="translate(100, 310)">
      <rect width="1000" height="58" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <g transform="translate(30, 35)">
        <text class="pill-text" fill="#94a3b8" font-size="14">ARCHITECTURE STACK:</text>
        <text x="175" y="0" class="pill-text" fill="#38bdf8">Identity Providers (IdP)</text>
        <text x="360" y="0" class="pill-text" fill="#64748b">→</text>
        <text x="390" y="0" class="pill-text" fill="#a855f7">Federation Engine</text>
        <text x="535" y="0" class="pill-text" fill="#64748b">→</text>
        <text x="565" y="0" class="pill-text" fill="#34d399">Service Providers (SP)</text>
        <text x="740" y="0" class="pill-text" fill="#64748b">→</text>
        <text x="770" y="0" class="pill-text" fill="#f43f5e">Zero Trust Access</text>
      </g>
    </g>
  </g>
</svg>
